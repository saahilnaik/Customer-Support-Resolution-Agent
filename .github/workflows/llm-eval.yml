name: LLM eval

# Calls the real Groq API (costs quota), so it never runs on push/PR.
# Run it manually from the Actions tab, or let the weekly schedule catch model drift.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"  # Mondays 06:00 UTC

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run eval (fails below thresholds)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m evals.run --delay 1 --json evals/last_run.json --min-intent 0.9 --min-action 0.85
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: evals/last_run.json
